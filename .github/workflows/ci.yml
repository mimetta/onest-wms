name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  database:
    name: Migrations from zero + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      # The acceptance test for every migration: the whole schema must build
      # from an empty database. `supabase db reset` applies every migration in
      # order and then runs seed.sql, so a migration that only works against
      # an already-populated database fails here.
      - run: supabase start
      - run: supabase db reset

      - run: npm test
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
